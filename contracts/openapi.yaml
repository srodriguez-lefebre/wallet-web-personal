              properties:
                color:
                  minLength: 1
                  type: string
                currency:
                  enum:
                    - UYU
                    - USD
                    - EUR
                    - BRL
                    - ARS
                  type: string
                icon:
                  minLength: 1
                  type: string
                initialBalance:
                  type: number
                isActive:
                  type: boolean
                isVisible:
                  type: boolean
                name:
                  minLength: 1
                  type: string
                note:
                  type: string
                type:
                  enum:
                    - cash
                    - bank
                    - credit_card
                    - savings
                    - recurring
                    - investment
                    - custom
                  type: string
              required:
                - name
                - type
                - currency
                - initialBalance
                - color
                - icon
                - isVisible
                - isActive
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    additionalProperties: false
                    properties:
