                        isActive:
                          type: boolean
                        isVisible:
                          type: boolean
                        name:
                          minLength: 1
                          type: string
                        note:
                          type: string
                        type:
                          enum:
                            - cash
                            - bank
                            - credit_card
                            - savings
                            - recurring
                            - investment
                            - custom
